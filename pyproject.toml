[project]
name = "ai-diagnostic-langgraph"
version = "0.1.0"
description = "LangGraph-based RAG diagnostic CLI with hot-switch LLM profiles"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.3.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "aiohttp>=3.9.0",
  "mcp>=1.0.0",
  "chromadb>=0.5.0",
  "loguru>=0.7.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
